<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found — GyanTech Blog</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:#f8fafc;
      color:#0f172a;
    }

    .page{
      width:100%;
      max-width:680px;
      text-align:center;
      padding:50px 28px;
      border:1px solid #e2e8f0;
      border-radius:24px;
      background:#fff;
      box-shadow:0 20px 60px rgba(15,23,42,.08);
    }

    .logo{
      display:inline-block;
      margin-bottom:28px;
      color:#0284c7;
      font-size:1.05rem;
      font-weight:900;
      text-decoration:none;
    }

    .number{
      font-size:clamp(5rem,18vw,9rem);
      line-height:.9;
      font-weight:950;
      letter-spacing:-.08em;
      color:#0f172a;
    }

    h1{
      margin-top:20px;
      font-size:clamp(1.7rem,5vw,2.5rem);
    }

    p{
      max-width:500px;
      margin:14px auto 0;
      color:#64748b;
      line-height:1.7;
    }

    .actions{
      display:flex;
      justify-content:center;
      flex-wrap:wrap;
      gap:12px;
      margin-top:28px;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-height:46px;
      padding:0 20px;
      border-radius:12px;
      background:#0284c7;
      color:#fff;
      text-decoration:none;
      font-weight:800;
      transition:transform .18s ease,box-shadow .18s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
      box-shadow:0 10px 25px rgba(2,132,199,.22);
    }

    .btn.secondary{
      background:#e2e8f0;
      color:#0f172a;
    }

    .hint{
      margin-top:25px;
      font-size:.82rem;
      color:#94a3b8;
    }

    @media(max-width:520px){
      .page{
        padding:40px 20px;
      }

      .actions{
        flex-direction:column;
      }

      .btn{
        width:100%;
      }
    }

    @media(prefers-reduced-motion:reduce){
      .btn{
        transition:none;
      }
    }
  </style>
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>

<body>

  <main class="page">

    <a href="/" class="logo">
      GyanTech Blog
    </a>

    <div class="number">
      404
    </div>

    <h1>
      Page not found
    </h1>

    <p>
      Oops! The page you're looking for doesn't exist,
      may have moved, or the URL may be incorrect.
    </p>

    <div class="actions">
      <a href="/" class="btn">
        ← Back to Home
      </a>

      <a href="/articles" class="btn secondary">
        Browse Articles
      </a>
    </div>

    <div class="hint">
      Technology explained simply.
    </div>

  </main>

<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}</script></body>
</html>
