<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Dashboard - GyanTech Blog</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Segoe UI,Arial,sans-serif;
}

body{
  background:#f5f7fb;
  color:#0f172a;
}

header{
  background:#0f172a;
  color:white;
  padding:16px 24px;
}

.nav{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#38bdf8;
  font-size:1.5rem;
  font-weight:800;
  text-decoration:none;
}

.nav a{
  color:#e2e8f0;
  text-decoration:none;
  margin-left:20px;
}

.container{
  max-width:1000px;
  margin:35px auto;
  padding:0 20px;
}

.box{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 5px 20px rgba(15,23,42,.05);
}

h2{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:600;
  margin:16px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:1rem;
  outline:none;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#0284c7;
}

textarea{
  min-height:220px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 17px;
  background:#0284c7;
  color:white;
  font-weight:700;
  cursor:pointer;
  margin-top:18px;
  margin-right:8px;
}

button:hover{
  background:#0369a1;
}

.secondary{
  background:#64748b;
}

.secondary:hover{
  background:#475569;
}

.danger{
  background:#dc2626;
}

.danger:hover{
  background:#b91c1c;
}

.hidden{
  display:none !important;
}

.small{
  color:#64748b;
  font-size:.9rem;
}

.msg{
  margin-top:15px;
  font-weight:600;
}

.article{
  border:1px solid #e2e8f0;
  border-radius:12px;
  padding:18px;
  margin-top:14px;
}

.article h3{
  margin-bottom:7px;
}

.article p{
  color:#64748b;
  line-height:1.5;
}

.badge{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  padding:4px 9px;
  border-radius:99px;
  font-size:.8rem;
  margin-top:10px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:20px;
}

.stat strong{
  display:block;
  font-size:1.8rem;
  margin-top:5px;
}

@media(max-width:700px){
  .stats{
    grid-template-columns:1fr 1fr;
  }

  .nav{
    gap:10px;
  }
}

@media(max-width:500px){
  .stats{
    grid-template-columns:1fr;
  }

  .nav{
    flex-direction:column;
    align-items:flex-start;
  }

  .nav a{
    margin-left:0;
    margin-right:15px;
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <a href="/" class="logo">
      GyanTech Blog
    </a>

    <div>
      <a href="/">Home</a>
      <a href="/articles">Articles</a>
      <a href="/admin">Admin</a>
    </div>

  </div>
</header>


<div class="container">

  <!-- LOGIN -->

  <div id="loginBox" class="box">

    <h2>🔐 Admin Login</h2>

    <p class="small">
      Sirf admin password se articles manage kiye ja sakte hain.
    </p>

    <form id="loginForm">

      <label>Password</label>

      <input
        id="loginPassword"
        type="password"
        placeholder="Admin password"
        required
      >

      <button type="submit">
        Login
      </button>

    </form>

    <div id="loginMsg" class="msg"></div>

  </div>


  <!-- DASHBOARD -->

  <div id="panel" class="hidden">

    <!-- STATS -->

    <div class="stats">

      <div class="stat">
        Total Articles
        <strong id="totalStat">0</strong>
      </div>

      <div class="stat">
        Published
        <strong id="publishedStat">0</strong>
      </div>

      <div class="stat">
        Drafts
        <strong id="draftStat">0</strong>
      </div>

      <div class="stat">
        Total Views
        <strong id="viewsStat">0</strong>
      </div>

    </div>


    <!-- PUBLISH -->

    <div class="box">

      <h2>➕ Publish Article</h2>

      <form id="articleForm">

        <input
          id="editId"
          type="hidden"
        >

        <label>Article Title</label>

        <input
          id="title"
          required
          placeholder="Example: Internet Kaise Kaam Karta Hai?"
        >


        <label>Author</label>

        <input
          id="author"
          value="Admin"
          required
        >


        <label>Category</label>

        <input
          id="category"
          value="Technology"
          placeholder="Technology"
        >


        <label>Excerpt</label>

        <input
          id="excerpt"
          placeholder="Short description of the article"
        >


        <label>Tags</label>

        <input
          id="tags"
          placeholder="AI, Coding, Technology"
        >


        <label>Image URL</label>

        <input
          id="image_url"
          placeholder="Optional image URL"
        >


        <label>Status</label>

        <select id="status">
          <option value="published">Published</option>
          <option value="draft">Draft</option>
        </select>


        <label>
          <input
            id="featured"
            type="checkbox"
            style="width:auto;margin-right:8px"
          >
          Featured Article
        </label>


        <label>Article Content</label>

        <textarea
          id="content"
          required
          placeholder="Yahan poora article likho..."
        ></textarea>


        <button id="saveBtn" type="submit">
          Publish Article
        </button>

        <button
          id="cancelBtn"
          type="button"
          class="secondary hidden"
        >
          Cancel Edit
        </button>

      </form>

      <div id="msg" class="msg"></div>

    </div>


    <!-- MANAGE -->

    <div class="box">

      <h2>📚 Manage Articles</h2>

      <div id="manageList">
        <p class="small">Loading...</p>
      </div>

      <button
        id="logout"
        class="secondary"
      >
        Logout
      </button>

    </div>

  </div>

</div>


<script>

const $ = id => document.getElementById(id);


/* API HELPER */

async function api(url, options = {}){

  const res = await fetch(url, {
    ...options,
    headers:{
      "Content-Type":"application/json",
      ...(options.headers || {})
    }
  });

  const data = await res.json().catch(() => ({}));

  if(!res.ok){
    throw new Error(data.error || "Something went wrong");
  }

  return data;
}


/* CHECK LOGIN */

async function checkLogin(){

  try{

    const data = await api("/api/admin/check");

    /*
      IMPORTANT:
      Server returns HTTP 200 even when user is not logged in.
      Therefore we MUST check authenticated.
    */

    if(!data.authenticated){

      $("loginBox").classList.remove("hidden");
      $("panel").classList.add("hidden");

      return;
    }

    $("loginBox").classList.add("hidden");
    $("panel").classList.remove("hidden");

    loadDashboard();

  }catch(err){

    $("loginBox").classList.remove("hidden");
    $("panel").classList.add("hidden");

  }
}


/* LOGIN */

$("loginForm").addEventListener("submit", async e => {

  e.preventDefault();

  $("loginMsg").textContent = "Logging in...";

  try{

    await api("/api/login",{
      method:"POST",
      body:JSON.stringify({
        password:$("loginPassword").value
      })
    });

    $("loginMsg").textContent =
      "✅ Login successful.";

    $("loginBox").classList.add("hidden");
    $("panel").classList.remove("hidden");

    $("loginPassword").value = "";

    loadDashboard();

  }catch(err){

    $("loginMsg").textContent =
      "❌ " + err.message;

  }

});


/* DASHBOARD */

async function loadDashboard(){

  await Promise.all([
    loadStats(),
    loadManage()
  ]);

}


/* STATS */

async function loadStats(){

  try{

    const s = await api("/api/admin/stats");

    $("totalStat").textContent = s.total;
    $("publishedStat").textContent = s.published;
    $("draftStat").textContent = s.drafts;
    $("viewsStat").textContent = s.views;

  }catch(err){

    console.error(err);

  }

}


/* PUBLISH / UPDATE */

$("articleForm").addEventListener("submit", async e => {

  e.preventDefault();

  const id = $("editId").value;

  const body = JSON.stringify({

    title:$("title").value.trim(),

    author:$("author").value.trim(),

    category:$("category").value.trim(),

    excerpt:$("excerpt").value.trim(),

    tags:$("tags").value.trim(),

    image_url:$("image_url").value.trim(),

    status:$("status").value,

    featured:$("featured").checked,

    content:$("content").value.trim()

  });


  try{

    if(id){

      await api(
        "/api/articles/" + id,
        {
          method:"PUT",
          body
        }
      );

      $("msg").textContent =
        "✅ Article updated.";

    }else{

      await api(
        "/api/articles",
        {
          method:"POST",
          body
        }
      );

      $("msg").textContent =
        "✅ Article published.";

    }

    resetForm();

    loadDashboard();

  }catch(err){

    $("msg").textContent =
      "❌ " + err.message;

  }

});


/* LOAD ADMIN ARTICLES */

async function loadManage(){

  try{

    /*
      IMPORTANT:
      Admin articles endpoint is /api/admin/articles
      NOT /api/articles
    */

    const articles =
      await api("/api/admin/articles");

    const list = $("manageList");

    if(!articles.length){

      list.innerHTML =
        "<p class='small'>No articles yet.</p>";

      return;

    }

    list.innerHTML = "";


    articles.forEach(a => {

      const div =
        document.createElement("div");

      div.className = "article";


      div.innerHTML = `

        <h3>${escapeHTML(a.title)}</h3>

        <p>
          ${escapeHTML(
            (a.excerpt || a.content || "").slice(0,180)
          )}
        </p>

        <span class="badge">
          ${escapeHTML(a.status)}
        </span>

        <span class="badge">
          ${escapeHTML(a.category)}
        </span>

        <span class="badge">
          👁 ${a.views || 0} views
        </span>

        <br>

        <button class="edit">
          Edit
        </button>

        <button class="danger delete">
          Delete
        </button>

      `;


      div.querySelector(".edit").onclick =
        () => startEdit(a);


      div.querySelector(".delete").onclick =
        () => deleteArticle(a.id);


      list.appendChild(div);

    });

  }catch(err){

    $("manageList").innerHTML =
      "<p class='small'>❌ " +
      escapeHTML(err.message) +
      "</p>";

  }

}


/* EDIT */

function startEdit(a){

  $("editId").value = a.id;

  $("title").value = a.title || "";

  $("author").value = a.author || "Admin";

  $("category").value =
    a.category || "Technology";

  $("excerpt").value =
    a.excerpt || "";

  $("tags").value =
    a.tags || "";

  $("image_url").value =
    a.image_url || "";

  $("status").value =
    a.status || "published";

  $("featured").checked =
    !!a.featured;

  $("content").value =
    a.content || "";

  $("saveBtn").textContent =
    "Update Article";

  $("cancelBtn").classList.remove("hidden");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* RESET */

function resetForm(){

  $("articleForm").reset();

  $("author").value = "Admin";

  $("category").value = "Technology";

  $("status").value = "published";

  $("editId").value = "";

  $("saveBtn").textContent =
    "Publish Article";

  $("cancelBtn").classList.add("hidden");

}


$("cancelBtn").onclick =
  resetForm;


/* DELETE */

async function deleteArticle(id){

  if(
    !confirm(
      "Is article ko delete karna hai?"
    )
  ) return;


  try{

    await api(
      "/api/articles/" + id,
      {
        method:"DELETE"
      }
    );

    await loadDashboard();

  }catch(err){

    alert(err.message);

  }

}


/* LOGOUT */

$("logout").onclick = async () => {

  try{

    await api(
      "/api/logout",
      {
        method:"POST"
      }
    );

  }finally{

    location.reload();

  }

};


/* ESCAPE HTML */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));

}


/* START */

checkLogin();

</script>

</body>
</html>
