<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Admin Dashboard — GyanTech</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f5f7fb;
  color:#0f172a;
}

header{
  background:#0f172a;
  color:white;
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:16px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#38bdf8;
  font-size:1.5rem;
  font-weight:900;
  text-decoration:none;
}

.nav a{
  color:#e2e8f0;
  text-decoration:none;
  margin-left:20px;
}

.nav a:hover{
  color:#38bdf8;
}

.container{
  max-width:1200px;
  margin:30px auto;
  padding:0 20px;
}

.box{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:18px;
  padding:25px;
  margin-bottom:22px;
  box-shadow:0 6px 25px rgba(15,23,42,.05);
}

.login{
  max-width:500px;
  margin:70px auto;
}

h1,h2,h3{
  margin-top:0;
}

.subtitle{
  color:#64748b;
}

label{
  display:block;
  margin:17px 0 7px;
  font-weight:700;
}

input,
textarea,
select{
  width:100%;
  padding:12px 13px;
  border:1px solid #cbd5e1;
  border-radius:9px;
  font-size:1rem;
  outline:none;
  background:white;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#0284c7;
  box-shadow:0 0 0 3px rgba(2,132,199,.1);
}

textarea{
  min-height:300px;
  resize:vertical;
}

button{
  border:0;
  border-radius:9px;
  padding:11px 17px;
  margin-top:18px;
  margin-right:8px;
  background:#0284c7;
  color:white;
  font-weight:800;
  cursor:pointer;
}

button:hover{
  background:#0369a1;
}

.secondary{
  background:#64748b;
}

.secondary:hover{
  background:#475569;
}

.danger{
  background:#dc2626;
}

.danger:hover{
  background:#b91c1c;
}

.hidden{
  display:none!important;
}

.msg{
  margin-top:15px;
  font-weight:700;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:16px;
  margin-bottom:22px;
}

.stat{
  background:white;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:20px;
}

.statTitle{
  color:#64748b;
  font-size:.9rem;
}

.statNumber{
  font-size:2rem;
  font-weight:900;
  margin-top:5px;
}

.editorGrid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:25px;
}

.sideBox{
  background:#f8fafc;
  border:1px solid #e2e8f0;
  border-radius:13px;
  padding:18px;
  height:max-content;
}

.preview{
  margin-top:12px;
  border-radius:10px;
  overflow:hidden;
  background:#e2e8f0;
}

.preview img{
  width:100%;
  max-height:220px;
  object-fit:cover;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:9px;
  margin-top:17px;
}

.checkbox input{
  width:auto;
}

.toolbar{
  display:flex;
  gap:10px;
  margin-bottom:18px;
}

.toolbar input{
  flex:1;
}

.article{
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:19px;
  margin-top:14px;
}

.articleTop{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.article h3{
  margin-bottom:5px;
}

.articleMeta{
  color:#64748b;
  font-size:.85rem;
  margin-top:8px;
}

.badge{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  padding:4px 9px;
  border-radius:999px;
  font-size:.78rem;
  font-weight:700;
  margin:8px 5px 0 0;
}

.badgeDraft{
  background:#fef3c7;
  color:#92400e;
}

.badgeFeatured{
  background:#ede9fe;
  color:#6d28d9;
}

.articleButtons{
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#64748b;
  padding:35px;
}

@media(max-width:850px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .editorGrid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .nav{
    flex-direction:column;
    gap:12px;
  }

  .nav a{
    margin-left:0;
    margin-right:14px;
  }

  .stats{
    grid-template-columns:1fr;
  }

  .toolbar{
    flex-direction:column;
  }

  .articleTop{
    flex-direction:column;
  }

}

</style>

</head>


<body>


<header>

  <div class="nav">

    <a
      href="/"
      class="logo"
    >
      GyanTech Blog
    </a>

    <nav>

      <a href="/">
        Home
      </a>

      <a href="/articles">
        Articles
      </a>

    </nav>

  </div>

</header>


<!-- LOGIN -->

<div
  id="loginBox"
  class="box login"
>

  <h2>🔐 Admin Login</h2>

  <p class="subtitle">
    Login to manage your GyanTech articles.
  </p>

  <form id="loginForm">

    <label>
      Admin Password
    </label>

    <input
      id="loginPassword"
      type="password"
      placeholder="Enter admin password"
      required
    >

    <button type="submit">
      Login
    </button>

  </form>

  <div
    id="loginMsg"
    class="msg"
  ></div>

</div>


<!-- DASHBOARD -->

<main
  id="dashboard"
  class="container hidden"
>


  <!-- STATS -->

  <section class="stats">

    <div class="stat">

      <div class="statTitle">
        Total Articles
      </div>

      <div
        id="totalStat"
        class="statNumber"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="statTitle">
        Published
      </div>

      <div
        id="publishedStat"
        class="statNumber"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="statTitle">
        Drafts
      </div>

      <div
        id="draftStat"
        class="statNumber"
      >
        0
      </div>

    </div>


    <div class="stat">

      <div class="statTitle">
        Total Views
      </div>

      <div
        id="viewsStat"
        class="statNumber"
      >
        0
      </div>

    </div>

  </section>


  <!-- EDITOR -->

  <section class="box">

    <h2 id="editorTitle">
      ✍️ Create New Article
    </h2>

    <p class="subtitle">
      Write, edit and publish your technology articles.
    </p>


    <form id="articleForm">

      <input
        id="editId"
        type="hidden"
      >


      <div class="editorGrid">


        <!-- MAIN EDITOR -->

        <div>

          <label>
            Article Title
          </label>

          <input
            id="title"
            required
            placeholder="Example: What is Artificial Intelligence?"
          >


          <label>
            Article Content
          </label>

          <textarea
            id="content"
            required
            placeholder="Write your complete article here..."
          ></textarea>


          <label>
            Excerpt
          </label>

          <textarea
            id="excerpt"
            style="min-height:110px"
            placeholder="Short description of your article..."
          ></textarea>

        </div>


        <!-- SETTINGS -->

        <div class="sideBox">

          <h3>
            Article Settings
          </h3>


          <label>
            Author
          </label>

          <input
            id="author"
            value="Admin"
            required
          >


          <label>
            Category
          </label>

          <input
            id="category"
            value="Technology"
            placeholder="AI"
          >


          <label>
            Tags
          </label>

          <input
            id="tags"
            placeholder="AI, Coding, Technology"
          >


          <label>
            Status
          </label>

          <select id="status">

            <option value="published">
              Published
            </option>

            <option value="draft">
              Draft
            </option>

          </select>


          <label>
            Image URL
          </label>

          <input
            id="image_url"
            placeholder="https://example.com/image.jpg"
          >


          <div
            id="imagePreview"
            class="preview hidden"
          >

            <img
              id="previewImg"
              alt="Preview"
            >

          </div>


          <label class="checkbox">

            <input
              id="featured"
              type="checkbox"
            >

            <span>
              ⭐ Featured Article
            </span>

          </label>

        </div>

      </div>


      <button
        id="saveBtn"
        type="submit"
      >
        Publish Article
      </button>


      <button
        id="cancelBtn"
        type="button"
        class="secondary hidden"
      >
        Cancel Edit
      </button>


    </form>


    <div
      id="msg"
      class="msg"
    ></div>

  </section>


  <!-- MANAGE ARTICLES -->

  <section class="box">

    <h2>
      📚 Manage Articles
    </h2>

    <div class="toolbar">

      <input
        id="adminSearch"
        placeholder="Search your articles..."
      >

      <button
        id="refreshBtn"
        type="button"
        class="secondary"
      >
        Refresh
      </button>

    </div>


    <div id="manageList">

      <div class="empty">
        Loading articles...
      </div>

    </div>


    <button
      id="logout"
      class="secondary"
    >
      Logout
    </button>

  </section>


</main>


<script>


/* =========================
   HELPERS
========================= */

const $ =
  id => document.getElementById(id);


async function api(
  url,
  options={}
){

  const response =
    await fetch(
      url,
      {
        ...options,

        headers:{
          "Content-Type":
            "application/json",

          ...(options.headers || {})
        }
      }
    );


  const data =
    await response
      .json()
      .catch(() => ({}));


  if(!response.ok){

    throw new Error(
      data.error ||
      "Something went wrong"
    );

  }


  return data;

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      m => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[m])
    );

}


/* =========================
   LOGIN CHECK
========================= */

async function checkLogin(){

  try{

    const data =
      await api(
        "/api/admin/check"
      );


    if(!data.authenticated){

      $("loginBox")
        .classList
        .remove("hidden");

      $("dashboard")
        .classList
        .add("hidden");

      return;

    }


    showDashboard();

  }catch{

    $("loginBox")
      .classList
      .remove("hidden");

  }

}


function showDashboard(){

  $("loginBox")
    .classList
    .add("hidden");

  $("dashboard")
    .classList
    .remove("hidden");

  loadDashboard();

}


/* =========================
   LOGIN
========================= */

$("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();

      $("loginMsg")
        .textContent =
        "Logging in...";


      try{

        await api(
          "/api/login",
          {
            method:"POST",

            body:JSON.stringify({
              password:
                $("loginPassword")
                .value
            })
          }
        );


        $("loginMsg")
          .textContent =
          "✅ Login successful.";

        $("loginPassword")
          .value = "";

        showDashboard();


      }catch(error){

        $("loginMsg")
          .textContent =
          "❌ " +
          error.message;

      }

    }
  );


/* =========================
   DASHBOARD
========================= */

async function loadDashboard(){

  await Promise.all([
    loadStats(),
    loadManage()
  ]);

}


/* =========================
   STATS
========================= */

async function loadStats(){

  try{

    const data =
      await api(
        "/api/admin/stats"
      );


    $("totalStat")
      .textContent =
      data.total || 0;

    $("publishedStat")
      .textContent =
      data.published || 0;

    $("draftStat")
      .textContent =
      data.drafts || 0;

    $("viewsStat")
      .textContent =
      data.views || 0;

  }catch(error){

    console.error(error);

  }

}


/* =========================
   IMAGE PREVIEW
========================= */

$("image_url")
  .addEventListener(
    "input",
    function(){

      const url =
        this.value.trim();


      if(!url){

        $("imagePreview")
          .classList
          .add("hidden");

        return;

      }


      $("previewImg").src = url;

      $("imagePreview")
        .classList
        .remove("hidden");

    }
  );


$("previewImg")
  .addEventListener(
    "error",
    function(){

      $("imagePreview")
        .classList
        .add("hidden");

    }
  );


/* =========================
   SAVE ARTICLE
========================= */

$("articleForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const id =
        $("editId").value;


      const article = {

        title:
          $("title")
          .value
          .trim(),

        author:
          $("author")
          .value
          .trim(),

        content:
          $("content")
          .value
          .trim(),

        excerpt:
          $("excerpt")
          .value
          .trim(),

        category:
          $("category")
          .value
          .trim(),

        tags:
          $("tags")
          .value
          .trim(),

        image_url:
          $("image_url")
          .value
          .trim(),

        status:
          $("status")
          .value,

        featured:
          $("featured")
          .checked

      };


      try{

        if(id){

          await api(
            "/api/articles/" + id,
            {
              method:"PUT",
              body:
                JSON.stringify(article)
            }
          );


          $("msg")
            .textContent =
            "✅ Article updated.";

        }else{

          await api(
            "/api/articles",
            {
              method:"POST",
              body:
                JSON.stringify(article)
            }
          );


          $("msg")
            .textContent =
            "✅ Article published.";

        }


        resetForm();

        await loadDashboard();


      }catch(error){

        $("msg")
          .textContent =
          "❌ " +
          error.message;

      }

    }
  );


/* =========================
   LOAD ARTICLES
========================= */

let allArticles = [];


async function loadManage(){

  try{

    allArticles =
      await api(
        "/api/admin/articles"
      );


    renderArticles(
      allArticles
    );


  }catch(error){

    $("manageList")
      .innerHTML =
      `
        <div class="empty">
          ❌ ${escapeHTML(
            error.message
          )}
        </div>
      `;

  }

}


/* =========================
   RENDER ARTICLES
========================= */

function renderArticles(
  articles
){

  const list =
    $("manageList");


  if(!articles.length){

    list.innerHTML =
      `
        <div class="empty">
          No articles found.
        </div>
      `;

    return;

  }


  list.innerHTML =
    articles
      .map(article => {

        const statusClass =
          article.status === "draft"
          ? "badgeDraft"
          : "";


        const featuredBadge =
          article.featured
          ? `
            <span class="badge badgeFeatured">
              ⭐ Featured
            </span>
          `
          : "";


        return `

          <div class="article">

            <div class="articleTop">

              <div>

                <h3>
                  ${escapeHTML(
                    article.title
                  )}
                </h3>

                <div class="articleMeta">

                  By
                  ${escapeHTML(
                    article.author ||
                    "Admin"
                  )}

                  ·

                  ${new Date(
                    article.created_at
                  ).toLocaleDateString(
                    "en-IN"
                  )}

                </div>

              </div>

            </div>


            <div>

              <span class="badge ${statusClass}">
                ${escapeHTML(
                  article.status ||
                  "published"
                )}
              </span>


              <span class="badge">
                ${escapeHTML(
                  article.category ||
                  "Technology"
                )}
              </span>


              <span class="badge">
                👁
                ${article.views || 0}
                views
              </span>


              ${featuredBadge}

            </div>


            <p class="subtitle">

              ${escapeHTML(
                (
                  article.excerpt ||
                  article.content ||
                  ""
                ).slice(0,220)
              )}

              ${
                (
                  article.excerpt ||
                  article.content ||
                  ""
                ).length > 220
                ? "..."
                : ""
              }

            </p>


            <div class="articleButtons">

              <button
                onclick="startEdit(${article.id})"
              >
                ✏️ Edit
              </button>


              <button
                class="danger"
                onclick="deleteArticle(${article.id})"
              >
                🗑️ Delete
              </button>


              ${
                article.status === "published"
                ? `
                  <a
                    href="/article/${encodeURIComponent(
                      article.slug
                    )}"
                    target="_blank"
                  >
                    <button
                      type="button"
                      class="secondary"
                    >
                      👁 View
                    </button>
                  </a>
                `
                : ""
              }

            </div>

          </div>

        `;

      })
      .join("");

}


/* =========================
   SEARCH
========================= */

$("adminSearch")
  .addEventListener(
    "input",
    function(){

      const search =
        this.value
          .trim()
          .toLowerCase();


      if(!search){

        renderArticles(
          allArticles
        );

        return;

      }


      const filtered =
        allArticles.filter(
          article =>
            String(
              article.title || ""
            )
            .toLowerCase()
            .includes(search)
            ||

            String(
              article.category || ""
            )
            .toLowerCase()
            .includes(search)
            ||

            String(
              article.tags || ""
            )
            .toLowerCase()
            .includes(search)
        );


      renderArticles(
        filtered
      );

    }
  );


/* =========================
   EDIT
========================= */

window.startEdit =
  function(id){

    const article =
      allArticles.find(
        x => x.id === id
      );


    if(!article){
      return;
    }


    $("editId").value =
      article.id;

    $("title").value =
      article.title || "";

    $("author").value =
      article.author || "Admin";

    $("content").value =
      article.content || "";

    $("excerpt").value =
      article.excerpt || "";

    $("category").value =
      article.category ||
      "Technology";

    $("tags").value =
      article.tags || "";

    $("image_url").value =
      article.image_url || "";

    $("status").value =
      article.status ||
      "published";

    $("featured").checked =
      !!article.featured;


    if(article.image_url){

      $("previewImg").src =
        article.image_url;

      $("imagePreview")
        .classList
        .remove("hidden");

    }else{

      $("imagePreview")
        .classList
        .add("hidden");

    }


    $("editorTitle")
      .textContent =
      "✏️ Edit Article";


    $("saveBtn")
      .textContent =
      "Update Article";


    $("cancelBtn")
      .classList
      .remove("hidden");


    $("msg")
      .textContent = "";


    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  };


/* =========================
   RESET
========================= */

function resetForm(){

  $("articleForm")
    .reset();


  $("editId")
    .value = "";


  $("author")
    .value =
    "Admin";


  $("category")
    .value =
    "Technology";


  $("status")
    .value =
    "published";


  $("editorTitle")
    .textContent =
    "✍️ Create New Article";


  $("saveBtn")
    .textContent =
    "Publish Article";


  $("cancelBtn")
    .classList
    .add("hidden");


  $("imagePreview")
    .classList
    .add("hidden");

}


$("cancelBtn")
  .addEventListener(
    "click",
    resetForm
  );


/* =========================
   DELETE
========================= */

window.deleteArticle =
  async function(id){

    const article =
      allArticles.find(
        x => x.id === id
      );


    const name =
      article
      ? article.title
      : "this article";


    if(
      !confirm(
        `Delete "${name}"?`
      )
    ){

      return;

    }


    try{

      await api(
        "/api/articles/" + id,
        {
          method:"DELETE"
        }
      );


      await loadDashboard();


    }catch(error){

      alert(
        "❌ " +
        error.message
      );

    }

  };


/* =========================
   REFRESH
========================= */

$("refreshBtn")
  .addEventListener(
    "click",
    loadDashboard
  );


/* =========================
   LOGOUT
========================= */

$("logout")
  .addEventListener(
    "click",
    async function(){

      try{

        await api(
          "/api/logout",
          {
            method:"POST"
          }
        );

      }finally{

        location.reload();

      }

    }
  );


/* =========================
   START
========================= */

checkLogin();

</script>

</body>
</html>
