<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<meta
  name="description"
  content="GyanTech Blog — AI, coding, web development and technology explained simply."
>

<title>GyanTech Blog</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Segoe UI,Arial,sans-serif;
  background:#f5f7fb;
  color:#10203a;
}

/* HEADER */

header{
  background:#0f172a;
  color:#fff;
}

.nav{
  max-width:1180px;
  margin:auto;
  padding:17px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  color:#38bdf8;
  font-weight:800;
  font-size:1.5rem;
  text-decoration:none;
}

.links{
  display:flex;
  gap:20px;
}

.links a{
  color:#e2e8f0;
  text-decoration:none;
  font-size:1rem;
}

.links a:hover{
  color:#38bdf8;
}

/* HERO */

.hero{
  max-width:1180px;
  margin:30px auto;
  padding:0 20px;
}

.heroBox{
  padding:48px 30px;
  border-radius:20px;
  background:linear-gradient(135deg,#dff6ff,#fff);
  border:1px solid #e2e8f0;
}

.heroBox h1{
  font-size:clamp(2rem,5vw,3.5rem);
  line-height:1.1;
  margin:0 0 15px;
}

.heroBox p{
  color:#64748b;
  font-size:1.1rem;
  line-height:1.6;
  margin-bottom:25px;
}

.btn{
  display:inline-block;
  background:#0284c7;
  color:#fff;
  padding:11px 16px;
  border-radius:8px;
  text-decoration:none;
  font-weight:700;
  border:0;
  cursor:pointer;
}

.btn:hover{
  background:#0369a1;
}

/* ARTICLES */

.wrap{
  max-width:1180px;
  margin:35px auto;
  padding:0 20px;
}

.sectionTitle{
  font-size:1.8rem;
  margin-bottom:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
  padding:20px;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
  box-shadow:0 8px 25px rgba(15,23,42,.08);
}

.card h2{
  margin:14px 0 8px;
  font-size:1.25rem;
  line-height:1.35;
}

.pill{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  border-radius:99px;
  padding:4px 9px;
  font-size:.78rem;
  font-weight:600;
}

.meta{
  color:#64748b;
  font-size:.84rem;
  line-height:1.5;
}

.excerpt{
  color:#475569;
  line-height:1.6;
  margin:14px 0 18px;
}

.empty{
  text-align:center;
  grid-column:1/-1;
  padding:40px;
  color:#64748b;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:14px;
}

/* FOOTER */

footer{
  margin-top:60px;
  background:#0f172a;
  color:#94a3b8;
  text-align:center;
  padding:25px 20px;
}

/* MOBILE */

@media(max-width:800px){

  .grid{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:560px){

  .grid{
    grid-template-columns:1fr;
  }

  .nav{
    flex-direction:column;
    gap:12px;
  }

  .heroBox{
    padding:35px 22px;
  }

  .links{
    gap:15px;
  }

}

</style>
</head>


<body>

<!-- HEADER -->

<header>

  <div class="nav">

    <a
      class="logo"
      href="/"
    >
      GyanTech Blog
    </a>

    <nav class="links">

      <a href="/">
        Home
      </a>

      <a href="/articles">
        Articles
      </a>

      <a href="/admin">
        Admin
      </a>

    </nav>

  </div>

</header>


<!-- HERO -->

<section class="hero">

  <div class="heroBox">

    <h1>
      Technology, explained simply.
    </h1>

    <p>
      AI, coding, web development and useful tech
      guides for learners.
    </p>

    <a
      class="btn"
      href="/articles"
    >
      Explore Articles →
    </a>

  </div>

</section>


<!-- LATEST ARTICLES -->

<section class="wrap">

  <h2 class="sectionTitle">
    Latest Articles
  </h2>

  <div
    id="grid"
    class="grid"
  >

    <div class="empty">
      Loading...
    </div>

  </div>

</section>


<!-- FOOTER -->

<footer>

  © 2026 GyanTech Blog

</footer>


<script>

/* GET ARTICLE GRID */

const grid =
  document.getElementById("grid");


/* ESCAPE HTML */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, function(m){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[m];

    });

}


/* LOAD ARTICLES */

async function loadArticles(){

  grid.innerHTML =
    '<div class="empty">Loading...</div>';


  try{

    const response =
      await fetch("/api/articles?limit=6");


    if(!response.ok){

      throw new Error(
        "Could not load articles"
      );

    }


    const data =
      await response.json();


    /* NO ARTICLES */

    if(
      !data.articles ||
      data.articles.length === 0
    ){

      grid.innerHTML =
        '<div class="empty">' +
        'No published articles yet.' +
        '</div>';

      return;

    }


    /* SHOW ARTICLES */

    grid.innerHTML =
      data.articles
        .map(function(article){

          const excerpt =
            article.excerpt ||
            (
              (article.content || "")
                .slice(0,150) +
              "..."
            );


          return `

            <article class="card">

              <span class="pill">
                ${escapeHTML(
                  article.category ||
                  "Technology"
                )}
              </span>

              <h2>
                ${escapeHTML(
                  article.title
                )}
              </h2>

              <div class="meta">

                By
                ${escapeHTML(
                  article.author ||
                  "Admin"
                )}

                ·

                ${new Date(
                  article.created_at
                ).toLocaleDateString(
                  "en-IN"
                )}

                ·

                ${article.views || 0}
                views

              </div>

              <p class="excerpt">
                ${escapeHTML(excerpt)}
              </p>

              <a
                class="btn"
                href="/article/${encodeURIComponent(
                  article.slug
                )}"
              >
                Read Article
              </a>

            </article>

          `;

        })
        .join("");


  }catch(error){

    console.error(
      "Article loading error:",
      error
    );


    grid.innerHTML =
      '<div class="empty">' +
      'Unable to load articles.' +
      '</div>';

  }

}


/* START */

loadArticles();

</script>

</body>
</html>
