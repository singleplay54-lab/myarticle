<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="GyanTech Blog — AI, coding, web development and technology explained simply."><title>GyanTech Blog</title><style>:root{--b:#0284c7;--d:#0f172a;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Segoe UI,Arial;background:var(--bg);color:#10203a}header{background:var(--d);color:#fff}.nav{max-width:1180px;margin:auto;padding:17px 20px;display:flex;justify-content:space-between;align-items:center}.logo{color:#38bdf8;font-weight:800;font-size:1.5rem}.links{display:flex;gap:20px}.links a{color:#e2e8f0;text-decoration:none}.hero,.wrap{max-width:1180px;margin:30px auto;padding:0 20px}.heroBox{padding:48px 30px;border-radius:20px;background:linear-gradient(135deg,#dff6ff,#fff);border:1px solid #e2e8f0}.heroBox h1{font-size:clamp(2rem,5vw,3.5rem);margin:0 0 10px}.heroBox p{color:#64748b;font-size:1.1rem}.btn{display:inline-block;background:var(--b);color:#fff;padding:11px 16px;border-radius:8px;text-decoration:none;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.pill{background:#e0f2fe;color:#0369a1;border-radius:99px;padding:4px 8px;font-size:.78rem}.meta{color:#64748b;font-size:.84rem}.excerpt{color:#475569;line-height:1.55}.empty{text-align:center;grid-column:1/-1;padding:30px;color:#64748b}footer{margin-top:50px;background:var(--d);color:#94a3b8;text-align:center;padding:25px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.links a:nth-child(3){display:none}}</style></head><body><header><div class="nav"><a class="logo" href="/">GyanTech Blog</a><nav class="links"><a href="/">Home</a><a href="/articles">Articles</a><a href="/admin">Admin</a></nav></div></header><section class="hero"><div class="heroBox"><h1>Technology, explained simply.</h1><p>AI, coding, web development and useful tech guides for learners.</p><a class="btn" href="/articles">Explore Articles →</a></div></section><section class="wrap"><h2>Latest Articles</h2><div id="grid" class="grid"><div class="empty">Loading...</div></div></section><footer>© 2026 GyanTech Blog</footer><script>async function load(){let g=document.querySelector('#grid');try{let d=await (await fetch('/api/articles?limit=6')).json();g.innerHTML=d.articles.length?d.articles.map(a=>`<article class="card"><span class="pill">${e(a.category)}</span><h2>${e(a.title)}</h2><div class="meta">By ${e(a.author)} · ${new Date(a.created_at).toLocaleDateString('en-IN')} · ${a.views} views</div><p class="excerpt">${e(a.excerpt||a.content.slice(0,150)+'...')}</p><a class="btn" href="/article/${encodeURIComponent(a.slug)}">Read Article</a></article>`).join(''):'<div class="empty">No published articles yet.</div>'}catch{g.innerHTML='<div class="empty">Unable to load articles.</div>'}}function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])}load()</script></body></html>
