<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Article — GyanTech</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  font-family:Segoe UI,Arial,sans-serif;
  color:#10203a;
  line-height:1.7;
}

.nav{
  background:#0f172a;
  padding:17px 22px;
}

.nav-inner{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.nav a{
  color:#38bdf8;
  font-weight:800;
  font-size:1.4rem;
  text-decoration:none;
}

.nav-links{
  display:flex;
  gap:20px;
}

.nav-links a{
  color:#e2e8f0;
  font-size:.95rem;
  font-weight:600;
}

.nav-links a:hover{
  color:#38bdf8;
}

.wrap{
  max-width:850px;
  margin:40px auto;
  padding:0 20px;
}

.article-card{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 8px 30px rgba(15,23,42,.06);
}

.hero-image{
  width:100%;
  max-height:430px;
  object-fit:cover;
  display:block;
}

.article-body{
  padding:38px;
}

.category{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  padding:5px 11px;
  border-radius:999px;
  font-size:.8rem;
  font-weight:800;
  margin-bottom:14px;
}

h1{
  margin:0 0 14px;
  font-size:clamp(2rem,5vw,3rem);
  line-height:1.2;
  color:#0f172a;
}

.meta{
  color:#64748b;
  font-size:.9rem;
  margin-bottom:25px;
}

.excerpt{
  padding:16px 18px;
  background:#f8fafc;
  border-left:4px solid #0284c7;
  border-radius:8px;
  color:#475569;
  margin-bottom:30px;
}

.content{
  color:#1e293b;
  font-size:1.08rem;
  overflow-wrap:anywhere;
}

.content h2{
  margin:34px 0 12px;
  font-size:1.65rem;
  line-height:1.3;
  color:#0f172a;
}

.content h3{
  margin:26px 0 10px;
  font-size:1.3rem;
  line-height:1.35;
  color:#0f172a;
}

.content p{
  margin:0 0 18px;
}

.content ul,
.content ol{
  margin:12px 0 20px;
  padding-left:28px;
}

.content li{
  margin-bottom:7px;
}

.content blockquote{
  margin:22px 0;
  padding:15px 20px;
  border-left:4px solid #0284c7;
  background:#f8fafc;
  color:#475569;
  font-style:italic;
  border-radius:0 10px 10px 0;
}

.content strong{
  color:#0f172a;
}

.content a{
  color:#0284c7;
  font-weight:600;
}

.content img{
  max-width:100%;
  height:auto;
  display:block;
  margin:20px auto;
  border-radius:12px;
}

.content pre{
  overflow:auto;
  background:#0f172a;
  color:#e2e8f0;
  padding:16px;
  border-radius:10px;
}

.content code{
  background:#f1f5f9;
  padding:2px 5px;
  border-radius:4px;
}

.tags{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:30px;
  padding-top:20px;
  border-top:1px solid #e2e8f0;
}

.tag{
  background:#f1f5f9;
  color:#475569;
  padding:5px 10px;
  border-radius:999px;
  font-size:.8rem;
  font-weight:700;
}

.back{
  display:inline-block;
  margin-bottom:18px;
  color:#0284c7;
  text-decoration:none;
  font-weight:700;
}

.loading,
.error{
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:16px;
  padding:40px 25px;
  text-align:center;
  color:#64748b;
}

.error{
  color:#b91c1c;
}

footer{
  text-align:center;
  padding:30px 20px;
  color:#64748b;
  font-size:.9rem;
}

@media(max-width:650px){
  .nav-inner{
    flex-direction:column;
    align-items:flex-start;
  }

  .nav-links{
    gap:14px;
  }

  .wrap{
    margin:25px auto;
    padding:0 12px;
  }

  .article-body{
    padding:25px 20px;
  }

  h1{
    font-size:2rem;
  }

  .content{
    font-size:1rem;
  }
}
</style>
</head>

<body>

<header class="nav">
  <div class="nav-inner">
    <a href="/">GyanTech Blog</a>

    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/articles">Articles</a>
    </nav>
  </div>
</header>

<main class="wrap">

  <a href="/articles" class="back">← Back to Articles</a>

  <div id="loading" class="loading">
    Loading article...
  </div>

  <article id="articleCard" class="article-card hidden">

    <img id="heroImage" class="hero-image hidden" alt="Article image">

    <div class="article-body">

      <div id="category" class="category hidden"></div>

      <h1 id="title"></h1>

      <div id="meta" class="meta"></div>

      <div id="excerpt" class="excerpt hidden"></div>

      <div id="content" class="content"></div>

      <div id="tags" class="tags hidden"></div>

    </div>

  </article>

  <div id="error" class="error hidden"></div>

</main>

<footer>
  <p>&copy; 2026 GyanTech Blog. All rights reserved.</p>
</footer>

<script>
const $ = id => document.getElementById(id);

/* Escape normal text safely */
function escapeHTML(value){
  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
}

/*
  Allow only the formatting produced by the GyanTech editor.
  This keeps headings, lists, bold, italic, underline and quotes
  while removing scripts/event attributes and other unsafe markup.
*/
function sanitizeHTML(html){
  const template = document.createElement("template");
  template.innerHTML = String(html || "");

  const allowed = new Set([
    "P","BR","H2","H3","STRONG","B","EM","I","U",
    "UL","OL","LI","BLOCKQUOTE","A","IMG","CODE","PRE"
  ]);

  const elements = template.content.querySelectorAll("*");

  elements.forEach(el => {
    if(!allowed.has(el.tagName)){
      const parent = el.parentNode;
      while(el.firstChild){
        parent.insertBefore(el.firstChild, el);
      }
      el.remove();
      return;
    }

    [...el.attributes].forEach(attr => {
      const name = attr.name.toLowerCase();

      if(el.tagName === "A" && name === "href"){
        const value = attr.value.trim();

        if(!/^https?:\/\//i.test(value)){
          el.removeAttribute(attr.name);
        }
      }else if(el.tagName === "IMG" && ["src","alt"].includes(name)){
        if(name === "src" && !/^https?:\/\//i.test(attr.value.trim())){
          el.removeAttribute(attr.name);
        }
      }else{
        el.removeAttribute(attr.name);
      }
    });

    if(el.tagName === "A"){
      el.setAttribute("target","_blank");
      el.setAttribute("rel","noopener noreferrer");
    }
  });

  return template.innerHTML;
}

/* Get slug from /article/:slug */
function getSlug(){
  const parts = location.pathname.split("/").filter(Boolean);
  return parts.length >= 2
    ? decodeURIComponent(parts[parts.length - 1])
    : "";
}

/* Load article */
async function loadArticle(){

  const slug = getSlug();

  if(!slug){
    showError("Article not found.");
    return;
  }

  try{

    const response = await fetch(
      "/api/articles/" + encodeURIComponent(slug)
    );

    const data = await response
      .json()
      .catch(() => ({}));

    if(!response.ok){
      throw new Error(
        data.error || "Article not found."
      );
    }

    renderArticle(data);

  }catch(error){

    console.error(error);
    showError(error.message || "Unable to load article.");

  }
}

/* Render */
function renderArticle(article){

  $("loading").classList.add("hidden");
  $("error").classList.add("hidden");
  $("articleCard").classList.remove("hidden");

  document.title =
    (article.title || "Article") +
    " — GyanTech";

  $("title").textContent =
    article.title || "Untitled Article";

  if(article.category){

    $("category").textContent =
      article.category;

    $("category")
      .classList
      .remove("hidden");

  }

  const author =
    article.author || "Admin";

  const date =
    article.created_at
      ? new Date(article.created_at)
          .toLocaleDateString("en-IN",{
            day:"numeric",
            month:"short",
            year:"numeric"
          })
      : "";

  const views =
    Number(article.views || 0);

  $("meta").textContent =
    `By ${author}` +
    (date ? ` · ${date}` : "") +
    ` · 👁 ${views} views`;

  if(article.excerpt){

    $("excerpt").textContent =
      article.excerpt;

    $("excerpt")
      .classList
      .remove("hidden");

  }

  /*
    Important:
    Admin Rich Text Editor stores HTML in article.content.
    We sanitize that HTML before displaying it.
  */
  $("content").innerHTML =
    sanitizeHTML(article.content || "");

  if(article.tags){

    const tags = String(article.tags)
      .split(",")
      .map(tag => tag.trim())
      .filter(Boolean);

    if(tags.length){

      $("tags").innerHTML =
        tags
          .map(tag =>
            `<span class="tag">#${escapeHTML(tag)}</span>`
          )
          .join("");

      $("tags")
        .classList
        .remove("hidden");

    }
  }

  if(article.image_url){

    $("heroImage").src =
      article.image_url;

    $("heroImage").alt =
      article.title || "Article image";

    $("heroImage")
      .classList
      .remove("hidden");

  }
}

/* Error */
function showError(message){

  $("loading")
    .classList
    .add("hidden");

  $("articleCard")
    .classList
    .add("hidden");

  $("error").textContent =
    "❌ " + message;

  $("error")
    .classList
    .remove("hidden");
}

loadArticle();
</script>

</body>
</html>
