<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article — GyanTech</title><style>body{margin:0;background:#f5f7fb;font-family:Segoe UI,Arial;color:#10203a}.nav{background:#0f172a;padding:17px 22px}.nav a{color:#38bdf8;font-weight:800;font-size:1.4rem;text-decoration:none}.wrap{max-width:850px;margin:30px auto;padding:0 20px}.back{color:#0369a1;font-weight:700;text-decoration:none}.article{margin-top:18px;background:#fff;border:1px solid #e2e8f0;border-radius:15px;padding:30px}.pill{background:#e0f2fe;color:#0369a1;padding:5px 8px;border-radius:99px;font-size:.8rem}.meta{color:#64748b}.content{white-space:pre-wrap;line-height:1.85;font-size:1.08rem;color:#334155}</style></head><body><div class="nav"><a href="/">GyanTech Blog</a></div><main class="wrap"><a class="back" href="/articles">← Back to Articles</a><article id="a" class="article">Loading...</article></main><script>let slug=decodeURIComponent(location.pathname.split('/').pop());fetch('/api/articles/'+encodeURIComponent(slug)).then(async r=>{if(!r.ok)throw 0;return r.json()}).then(x=>{document.title=x.title+' — GyanTech';a.innerHTML=`<span class="pill">${e(x.category)}</span><h1>${e(x.title)}</h1><p class="meta">By ${e(x.author)} · ${new Date(x.created_at).toLocaleDateString('en-IN')} · ${x.views} views</p><p class="content">${e(x.content)}</p>`}).catch(()=>a.innerHTML='<h1>Article not found</h1>');function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])}</script></body></html>
