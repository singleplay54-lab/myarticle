<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Article — GyanTech</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  font-family:Segoe UI,Arial,sans-serif;
  color:#10203a;
}

.nav{
  background:#0f172a;
  padding:17px 22px;
}

.nav a{
  color:#38bdf8;
  font-weight:800;
  font-size:1.4rem;
  text-decoration:none;
}

.wrap{
  max-width:850px;
  margin:30px auto;
  padding:0 20px;
}

.back{
  color:#0369a1;
  font-weight:700;
  text-decoration:none;
}

.article{
  margin-top:18px;
  background:#fff;
  border:1px solid #e2e8f0;
  border-radius:15px;
  padding:30px;
}

.pill{
  display:inline-block;
  background:#e0f2fe;
  color:#0369a1;
  padding:5px 9px;
  border-radius:99px;
  font-size:.8rem;
}

h1{
  font-size:clamp(2rem,5vw,3rem);
  line-height:1.15;
  margin:18px 0 10px;
}

.meta{
  color:#64748b;
  font-size:.9rem;
  margin-bottom:25px;
}

.content{
  white-space:pre-wrap;
  line-height:1.85;
  font-size:1.08rem;
  color:#334155;
}

.article-image{
  width:100%;
  max-height:420px;
  object-fit:cover;
  border-radius:12px;
  margin:10px 0 25px;
}

.tags{
  margin-top:25px;
}

.tag{
  display:inline-block;
  background:#f1f5f9;
  color:#475569;
  padding:5px 9px;
  border-radius:7px;
  margin:4px;
  font-size:.85rem;
}

.error{
  text-align:center;
  padding:40px 10px;
}

@media(max-width:600px){

  .article{
    padding:20px;
  }

  h1{
    font-size:2rem;
  }

}

</style>
</head>


<body>

<div class="nav">
  <a href="/">GyanTech Blog</a>
</div>


<main class="wrap">

  <a class="back" href="/articles">
    ← Back to Articles
  </a>


  <article id="article" class="article">

    <p>Loading...</p>

  </article>

</main>


<script>

/* Article container */

const article =
  document.getElementById("article");


/* Get slug from URL */

const parts =
  location.pathname.split("/");

const slug =
  decodeURIComponent(parts[parts.length - 1]);


/* Escape HTML */

function e(value){

  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));

}


/* Load article */

async function loadArticle(){

  try{

    if(!slug){

      throw new Error("Missing article slug");

    }


    const response =
      await fetch(
        "/api/articles/" +
        encodeURIComponent(slug)
      );


    const data =
      await response.json().catch(() => ({}));


    if(!response.ok){

      throw new Error(
        data.error || "Article not found"
      );

    }


    /* Page title */

    document.title =
      data.title + " — GyanTech";


    /* Tags */

    let tagsHTML = "";

    if(data.tags){

      const tags =
        String(data.tags)
          .split(",")
          .map(x => x.trim())
          .filter(Boolean);

      if(tags.length){

        tagsHTML = `
          <div class="tags">
            ${tags.map(tag =>
              `<span class="tag">
                #${e(tag)}
              </span>`
            ).join("")}
          </div>
        `;

      }

    }


    /* Image */

    const imageHTML =
      data.image_url
      ? `
        <img
          class="article-image"
          src="${e(data.image_url)}"
          alt="${e(data.title)}"
          onerror="this.style.display='none'"
        >
      `
      : "";


    /* Article */

    article.innerHTML = `

      <span class="pill">
        ${e(data.category || "Technology")}
      </span>

      <h1>
        ${e(data.title)}
      </h1>

      <div class="meta">
        By ${e(data.author || "Admin")}
        ·
        ${new Date(data.created_at)
          .toLocaleDateString("en-IN")}
        ·
        ${data.views || 0} views
      </div>

      ${imageHTML}

      <div class="content">
        ${e(data.content)}
      </div>

      ${tagsHTML}

    `;


  }catch(error){

    console.error(error);

    article.innerHTML = `

      <div class="error">

        <h1>Article not found</h1>

        <p>
          This article could not be loaded.
        </p>

        <a
          class="back"
          href="/articles"
        >
          ← Back to Articles
        </a>

      </div>

    `;

  }

}


/* Start */

loadArticle();

</script>

</body>
</html>
