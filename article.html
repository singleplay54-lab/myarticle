<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Article — GyanTech</title>

<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;font-family:Segoe UI,Arial,sans-serif;color:#10203a;line-height:1.7}
.nav{background:#0f172a;padding:17px 22px}
.nav-inner{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:20px}
.nav a{color:#38bdf8;font-weight:800;font-size:1.4rem;text-decoration:none}
.nav-links{display:flex;gap:20px}
.nav-links a{color:#e2e8f0;font-size:.95rem;font-weight:600}
.nav-links a:hover{color:#38bdf8}
.wrap{max-width:850px;margin:40px auto;padding:0 20px}
.article-card{background:#fff;border:1px solid #e2e8f0;border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(15,23,42,.06)}
.hero-image{width:100%;max-height:430px;object-fit:cover;display:block}
.article-body{padding:38px}
.category{display:inline-block;background:#e0f2fe;color:#0369a1;padding:5px 11px;border-radius:999px;font-size:.8rem;font-weight:800;margin-bottom:14px}
h1{margin:0 0 14px;font-size:clamp(2rem,5vw,3rem);line-height:1.2;color:#0f172a}
.meta{color:#64748b;font-size:.9rem;margin-bottom:25px}
.excerpt{padding:16px 18px;background:#f8fafc;border-left:4px solid #0284c7;border-radius:8px;color:#475569;margin-bottom:30px}
.content{color:#1e293b;font-size:1.08rem;overflow-wrap:anywhere}
.content h2{margin:34px 0 12px;font-size:1.65rem;line-height:1.3;color:#0f172a}
.content h3{margin:26px 0 10px;font-size:1.3rem;line-height:1.35;color:#0f172a}
.content p{margin:0 0 18px}
.content ul,.content ol{margin:12px 0 20px;padding-left:28px}
.content li{margin-bottom:7px}
.content blockquote{margin:22px 0;padding:15px 20px;border-left:4px solid #0284c7;background:#f8fafc;color:#475569;font-style:italic;border-radius:0 10px 10px 0}
.content strong{color:#0f172a}
.content a{color:#0284c7;font-weight:600}
.content img{max-width:100%;height:auto;display:block;margin:20px auto;border-radius:12px}
.content pre{overflow:auto;background:#0f172a;color:#e2e8f0;padding:16px;border-radius:10px}
.content code{background:#f1f5f9;padding:2px 5px;border-radius:4px}

.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:30px;padding-top:20px;border-top:1px solid #e2e8f0}
.tag{background:#f1f5f9;color:#475569;padding:5px 10px;border-radius:999px;font-size:.8rem;font-weight:700}

/* Share section */
.share-box{margin-top:32px;padding:22px;border:1px solid #e2e8f0;border-radius:16px;background:#f8fafc}
.share-title{margin:0 0 14px;font-size:1.05rem;font-weight:800;color:#0f172a}
.share-buttons{display:flex;flex-wrap:wrap;gap:10px}
.share-btn{border:0;border-radius:10px;padding:10px 15px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:7px;transition:.2s;box-shadow:0 2px 8px rgba(15,23,42,.06)}
.share-btn:hover{transform:translateY(-1px);filter:brightness(.97)}
.share-whatsapp{background:#dcfce7;color:#166534}
.share-facebook{background:#dbeafe;color:#1d4ed8}
.share-x{background:#e2e8f0;color:#0f172a}
.share-copy{background:#e0f2fe;color:#0369a1}
.share-status{margin:10px 0 0;color:#64748b;font-size:.82rem;min-height:20px}

.back{display:inline-block;margin-bottom:18px;color:#0284c7;text-decoration:none;font-weight:700}
.loading,.error{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:40px 25px;text-align:center;color:#64748b}
.error{color:#b91c1c}
.hidden{display:none!important}
footer{text-align:center;padding:30px 20px;color:#64748b;font-size:.9rem}

@media(max-width:650px){
  .nav-inner{flex-direction:column;align-items:flex-start}
  .nav-links{gap:14px}
  .wrap{margin:25px auto;padding:0 12px}
  .article-body{padding:25px 20px}
  h1{font-size:2rem}
  .content{font-size:1rem}
  .share-buttons{display:grid;grid-template-columns:1fr 1fr}
  .share-btn{justify-content:center}
}

/* Stage 5 — professional reading experience */
#readingProgress{position:fixed;top:0;left:0;width:0;height:4px;background:#0284c7;z-index:9999;transition:width .08s linear}
.related-section{margin-top:34px}
.section-title{margin:0 0 16px;font-size:1.45rem;color:#0f172a}
.article-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.related-card{display:flex;flex-direction:column;min-height:170px;padding:18px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;text-decoration:none;color:#10203a;box-shadow:0 5px 18px rgba(15,23,42,.05);transition:transform .2s,box-shadow .2s,border-color .2s}
.related-card:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(15,23,42,.09);border-color:#bae6fd}
.related-category{display:inline-block;align-self:flex-start;margin-bottom:9px;padding:4px 9px;border-radius:999px;background:#e0f2fe;color:#0369a1;font-size:.72rem;font-weight:800}
.related-card h3{margin:0 0 8px;font-size:1.02rem;line-height:1.4;color:#0f172a}
.related-meta{margin-top:auto;color:#64748b;font-size:.78rem}
.back-top{position:fixed;right:20px;bottom:20px;width:44px;height:44px;border:0;border-radius:50%;background:#0f172a;color:#fff;font-size:1.1rem;cursor:pointer;display:none;box-shadow:0 8px 20px rgba(15,23,42,.18);z-index:1000}
.back-top.show{display:block}
@media(max-width:800px){.article-grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.article-grid{grid-template-columns:1fr}.back-top{right:14px;bottom:14px}}


/* Share buttons near article title */
.share-box{margin:18px 0 28px;padding:18px 20px;border:1px solid #bae6fd;border-radius:16px;background:#f0f9ff}
.share-title{margin:0 0 12px;font-size:1rem}
.share-buttons{display:flex;flex-wrap:wrap;gap:10px}
.share-btn{min-height:42px}
@media(max-width:520px){.share-buttons{display:grid;grid-template-columns:1fr 1fr}.share-btn{justify-content:center}}


/* Guaranteed visible sharing bar */
.share-box{
  display:block!important;
  visibility:visible!important;
  margin:0 0 22px;
  padding:18px 20px;
  border:1px solid #bae6fd;
  border-radius:16px;
  background:#f0f9ff;
  position:relative;
  z-index:2;
}
.share-title{margin:0 0 12px;font-size:1rem;font-weight:800;color:#0f172a}
.share-buttons{display:flex;flex-wrap:wrap;gap:10px}
.share-btn{border:0;border-radius:10px;padding:10px 15px;min-height:42px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:7px}
@media(max-width:520px){.share-buttons{display:grid;grid-template-columns:1fr 1fr}.share-btn{width:100%}}

</style>
</head>

<body>
<div id="readingProgress" aria-hidden="true"></div>
<header class="nav">
  <div class="nav-inner">
    <a href="/">GyanTech Blog</a>
    <nav class="nav-links">
      <a href="/">Home</a>
      <a href="/articles">Articles</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <a href="/articles" class="back">← Back to Articles</a>

  <section class="share-box" aria-label="Share article">
        <h2 class="share-title">🔗 Share this article</h2>

        <div class="share-buttons">
          <a id="whatsappShare"
             class="share-btn share-whatsapp"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            🟢 WhatsApp
          </a>

          <a id="facebookShare"
             class="share-btn share-facebook"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            🔵 Facebook
          </a>

          <a id="xShare"
             class="share-btn share-x"
             href="#"
             target="_blank"
             rel="noopener noreferrer">
            𝕏 Share
          </a>

          <button id="copyShare"
                  class="share-btn share-copy"
                  type="button">
            🔗 Copy Link
          </button>
        </div>

        <p id="shareStatus" class="share-status"></p>
      </section>

  <div id="loading" class="loading">Loading article...</div>

  <article id="articleCard" class="article-card hidden">
    <img id="heroImage" class="hero-image hidden" alt="Article image">

    <div class="article-body">
      <div id="category" class="category hidden"></div>

      <h1 id="title"></h1>

      <div id="meta" class="meta"></div>

      

      <div id="excerpt" class="excerpt hidden"></div>

      <div id="content" class="content"></div>

      <div id="tags" class="tags hidden"></div>


    </div>
  </article>

  <div id="error" class="error hidden"></div>

  <section id="relatedSection" class="related-section hidden" aria-label="Related articles">
    <h2 class="section-title">📚 Related Articles</h2>
    <div id="relatedGrid" class="article-grid"></div>
  </section>
  <section id="latestSection" class="related-section hidden" aria-label="Latest articles">
    <h2 class="section-title">📰 Latest Articles</h2>
    <div id="latestGrid" class="article-grid"></div>
  </section>

</main>

<button id="backTop" class="back-top" type="button" aria-label="Back to top">↑</button>

<footer>
  <p>&copy; 2026 GyanTech Blog. All rights reserved.</p>
</footer>

<script>
const $ = id => document.getElementById(id);

function escapeHTML(value){
  return String(value ?? "")
    .replace(/[&<>"']/g, m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m]));
}

function sanitizeHTML(html){
  const template = document.createElement("template");
  template.innerHTML = String(html || "");

  const allowed = new Set([
    "P","BR","H2","H3","STRONG","B","EM","I","U",
    "UL","OL","LI","BLOCKQUOTE","A","IMG","CODE","PRE"
  ]);

  const elements = template.content.querySelectorAll("*");

  elements.forEach(el => {

    if(!allowed.has(el.tagName)){
      const parent = el.parentNode;

      while(el.firstChild){
        parent.insertBefore(el.firstChild, el);
      }

      el.remove();
      return;
    }

    [...el.attributes].forEach(attr => {

      const name = attr.name.toLowerCase();

      if(el.tagName === "A" && name === "href"){

        const value = attr.value.trim();

        if(!/^https?:\/\//i.test(value)){
          el.removeAttribute(attr.name);
        }

      }else if(
        el.tagName === "IMG" &&
        ["src","alt"].includes(name)
      ){

        if(
          name === "src" &&
          !/^https?:\/\//i.test(attr.value.trim())
        ){
          el.removeAttribute(attr.name);
        }

      }else{

        el.removeAttribute(attr.name);

      }

    });

    if(el.tagName === "A"){
      el.setAttribute("target","_blank");
      el.setAttribute("rel","noopener noreferrer");
    }

  });

  return template.innerHTML;
}

function getSlug(){

  const parts =
    location.pathname
      .split("/")
      .filter(Boolean);

  return parts.length >= 2
    ? decodeURIComponent(parts[parts.length - 1])
    : "";
}

function setupShare(article){

  const shareURL = location.href;
  const shareTitle = article.title || "GyanTech Blog";

  $("whatsappShare").href =
    "https://wa.me/?text=" +
    encodeURIComponent(
      shareTitle + " - " + shareURL
    );

  $("facebookShare").href =
    "https://www.facebook.com/sharer/sharer.php?u=" +
    encodeURIComponent(shareURL);

  $("xShare").href =
    "https://twitter.com/intent/tweet?text=" +
    encodeURIComponent(shareTitle) +
    "&url=" +
    encodeURIComponent(shareURL);

  $("copyShare").onclick = async () => {

    try{

      await navigator.clipboard.writeText(shareURL);

      $("shareStatus").textContent =
        "✅ Article link copied!";

    }catch{

      $("shareStatus").textContent =
        "Please copy the URL from your browser.";

    }

  };
}


function articleCardHTML(article){
  const title = escapeHTML(article.title || "Untitled Article");
  const category = escapeHTML(article.category || "Technology");
  const date = article.created_at ? new Date(article.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"}) : "";
  return `<a class="related-card" href="/article/${encodeURIComponent(article.slug || "")}">
    <span class="related-category">${category}</span>
    <h3>${title}</h3>
    <div class="related-meta">${date ? date + " · " : ""}👁 ${Number(article.views || 0)} views</div>
  </a>`;
}

async function loadArticleLists(currentArticle){
  try{
    const response = await fetch("/api/articles?limit=8");
    const data = await response.json().catch(() => []);
    if(!response.ok) return;
    const articles = Array.isArray(data) ? data : (Array.isArray(data.articles) ? data.articles : []);
    const currentSlug = getSlug();
    const candidates = articles.filter(article => article && article.slug && article.slug !== currentSlug);

    const related = candidates.filter(article =>
      currentArticle.category && article.category === currentArticle.category
    ).slice(0,3);

    if(related.length){
      $("relatedGrid").innerHTML = related.map(articleCardHTML).join("");
      $("relatedSection").classList.remove("hidden");
    }

    const latest = candidates.filter(article => !related.some(r => r.slug === article.slug)).slice(0,3);
    if(latest.length){
      $("latestGrid").innerHTML = latest.map(articleCardHTML).join("");
      $("latestSection").classList.remove("hidden");
    }
  }catch(error){
    console.warn("Related/latest articles unavailable:", error);
  }
}

function setupReadingProgress(){
  const update = () => {
    const doc = document.documentElement;
    const max = doc.scrollHeight - window.innerHeight;
    const progress = max > 0 ? (window.scrollY / max) * 100 : 0;
    $("readingProgress").style.width = Math.min(100,Math.max(0,progress)) + "%";
    $("backTop").classList.toggle("show",window.scrollY > 450);
  };
  window.addEventListener("scroll",update,{passive:true});
  update();
}

$("backTop").addEventListener("click",() => {
  window.scrollTo({top:0,behavior:"smooth"});
});


function initializeShareButtons(){
  const url = window.location.href;
  const title = document.title || "GyanTech Blog";

  const wa = $("whatsappShare");
  const fb = $("facebookShare");
  const x = $("xShare");
  const copy = $("copyShare");

  if(wa) wa.href = "https://wa.me/?text=" + encodeURIComponent(title + " - " + url);
  if(fb) fb.href = "https://www.facebook.com/sharer/sharer.php?u=" + encodeURIComponent(url);
  if(x) x.href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(title) + "&url=" + encodeURIComponent(url);

  if(copy){
    copy.onclick = async function(){
      try{
        await navigator.clipboard.writeText(url);
        const status = $("shareStatus");
        if(status) status.textContent = "✅ Article link copied!";
      }catch(error){
        const status = $("shareStatus");
        if(status) status.textContent = "Please copy the URL from your browser.";
      }
    };
  }
}

async function loadArticle(){

  const slug = getSlug();

  if(!slug){
    showError("Article not found.");
    return;
  }

  try{

    const response =
      await fetch(
        "/api/articles/" +
        encodeURIComponent(slug)
      );

    const data =
      await response
        .json()
        .catch(() => ({}));

    if(!response.ok){
      throw new Error(
        data.error ||
        "Article not found."
      );
    }

    renderArticle(data);

  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to load article."
    );

  }
}

function renderArticle(article){

  $("loading")
    .classList.add("hidden");

  $("error")
    .classList.add("hidden");

  $("articleCard")
    .classList.remove("hidden");

  document.title =
    (article.title || "Article") +
    " — GyanTech";

  $("title").textContent =
    article.title ||
    "Untitled Article";

  if(article.category){

    $("category").textContent =
      article.category;

    $("category")
      .classList
      .remove("hidden");

  }

  const author =
    article.author || "Admin";

  const date =
    article.created_at
      ? new Date(article.created_at)
          .toLocaleDateString(
            "en-IN",
            {
              day:"numeric",
              month:"short",
              year:"numeric"
            }
          )
      : "";

  const views =
    Number(article.views || 0);

  $("meta").textContent =
    `By ${author}` +
    (date ? ` · ${date}` : "") +
    ` · 👁 ${views} views`;

  if(article.excerpt){

    $("excerpt").textContent =
      article.excerpt;

    $("excerpt")
      .classList
      .remove("hidden");

  }

  $("content").innerHTML =
    sanitizeHTML(
      article.content || ""
    );

  if(article.tags){

    const tags =
      String(article.tags)
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean);

    if(tags.length){

      $("tags").innerHTML =
        tags
          .map(tag =>
            `<span class="tag">#${escapeHTML(tag)}</span>`
          )
          .join("");

      $("tags")
        .classList
        .remove("hidden");

    }

  }

  if(article.image_url){

    $("heroImage").src =
      article.image_url;

    $("heroImage").alt =
      article.title ||
      "Article image";

    $("heroImage")
      .classList
      .remove("hidden");

  }

  setupShare(article);
  loadArticleLists(article);
  setupReadingProgress();
}

function showError(message){

  $("loading")
    .classList
    .add("hidden");

  $("articleCard")
    .classList
    .add("hidden");

  $("error").textContent =
    "❌ " + message;

  $("error")
    .classList
    .remove("hidden");
}

initializeShareButtons();
loadArticle();
</script>

</body>
</html>
