<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Articles — GyanTech</title><style>body{margin:0;background:#f5f7fb;font-family:Segoe UI,Arial;color:#10203a}header{background:#0f172a}.nav{max-width:1180px;margin:auto;padding:17px 20px;display:flex;justify-content:space-between}.logo{color:#38bdf8;font-weight:800;font-size:1.4rem}.nav a{color:#fff;text-decoration:none;margin-left:18px}.wrap{max-width:1180px;margin:30px auto;padding:0 20px}.tools{display:grid;grid-template-columns:2fr 1fr auto;gap:10px;background:#fff;padding:15px;border:1px solid #e2e8f0;border-radius:12px;margin:20px 0}input,select{padding:11px;border:1px solid #cbd5e1;border-radius:8px;font-size:1rem}.btn{border:0;background:#0284c7;color:#fff;padding:11px 16px;border-radius:8px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:18px}.pill{background:#e0f2fe;color:#0369a1;padding:4px 8px;border-radius:99px;font-size:.78rem}.meta{color:#64748b;font-size:.84rem}.read{color:#0369a1;font-weight:700;text-decoration:none}.empty{text-align:center;grid-column:1/-1;padding:35px;color:#64748b}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.tools{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="nav"><a class="logo" href="/">GyanTech Blog</a><nav><a href="/">Home</a><a href="/admin">Admin</a></nav></div></header><div class="wrap"><h1>All Articles</h1><div class="tools"><input id="q" placeholder="Search articles..."><select id="cat"><option value="">All categories</option></select><button class="btn" onclick="load(1)">Search</button></div><div id="grid" class="grid"></div><p id="pager" style="text-align:center"></p></div><script>const lim=9;async function cats(){let d=await(await fetch('/api/categories')).json();cat.innerHTML='<option value="">All categories</option>'+d.map(x=>`<option>${e(x.category)}</option>`).join('')}async function load(p=1){grid.innerHTML='<div class="empty">Loading...</div>';let u=`/api/articles?q=${encodeURIComponent(q.value)}&category=${encodeURIComponent(cat.value)}&page=${p}&limit=${lim}`;try{let d=await(await fetch(u)).json();grid.innerHTML=d.articles.length?d.articles.map(a=>`<article class="card"><span class="pill">${e(a.category)}</span><h2>${e(a.title)}</h2><div class="meta">By ${e(a.author)} · ${new Date(a.created_at).toLocaleDateString('en-IN')} · ${a.views} views</div><p>${e(a.excerpt||a.content.slice(0,160)+'...')}</p><a class="read" href="/article/${encodeURIComponent(a.slug)}">Read full article →</a></article>`).join(''):'<div class="empty">No articles found.</div>';let pages=Math.ceil(d.total/lim);pager.innerHTML=(p>1?`<button class="btn" onclick="load(${p-1})">← Prev</button> `:'')+(p<pages?`<button class="btn" onclick="load(${p+1})">Next →</button>`:'')}catch{grid.innerHTML='<div class="empty">Unable to load.</div>'}}function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])}cats().then(()=>load())</script></body></html>
